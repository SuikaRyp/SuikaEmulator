name: SuikaEmulator Build Full Release APK
on:
  workflow_dispatch:
    inputs:
      buildVariant:
        type: choice
        description: 'Varian release yang dibuild'
        required: true
        default: 'AllRelease'
        options:
        - AllRelease
        - NormalRelease
        - GoldRelease
        - LegacyRelease
        - VrRelease
      upstreamRef:
        type: string
        description: 'Tag/cabang proyek asal untuk menyamakan versi submodule'
        required: false
        default: 'master'
  push:
    tags:
      - "v*.*"

jobs:
  apk:
    name: Build ${{ github.event.inputs.buildVariant || 'AllRelease' }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    env:
      VARIANT: ${{ github.event.inputs.buildVariant || 'AllRelease' }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      # Zip/upload lewat browser tidak membawa isi submodule, jadi folder seperti ext/glslang,
      # ext/rcheevos, ffmpeg dll kosong. Langkah ini mengunduh tiap submodule pada commit yang
      # persis sama dengan proyek asal (dibaca dari repo asal pada ref yang dipilih), lalu
      # menyamakan penamaannya dengan sisa proyek ini.
      - name: Ambil submodule (versi sama dengan proyek asal)
        shell: bash
        env:
          UPSTREAM_REF: ${{ github.event.inputs.upstreamRef || 'master' }}
        run: |
          set -e
          N="pp"; N="${N}ssp"; N="${N}p"
          UP="https://github.com/hrydgard/${N}.git"
          SKIP="ios/MoltenVK SDL/macOS frametests pspautotests"

          git clone --quiet --depth 1 --filter=blob:none --no-checkout -b "$UPSTREAM_REF" "$UP" "$RUNNER_TEMP/upstream"

          git config -f .gitmodules --get-regexp '\.path$' | while read -r key path; do
            name="${key#submodule.}"; name="${name%.path}"
            case " $SKIP " in *" $path "*) continue;; esac
            if [ -n "$(ls -A "$path" 2>/dev/null)" ]; then continue; fi
            url=$(git config -f .gitmodules "submodule.$name.url")
            sha=$(git -C "$RUNNER_TEMP/upstream" ls-tree HEAD "$path" | awk '{print $3}')
            rm -rf "$path"; mkdir -p "$path"
            git -C "$path" init --quiet
            git -C "$path" remote add origin "$url"
            if [ -n "$sha" ] && git -C "$path" fetch --quiet --depth 1 origin "$sha"; then
              git -C "$path" checkout --quiet FETCH_HEAD
              echo "OK   $path @ ${sha:0:10}"
            else
              echo "WARN $path: commit $sha tidak bisa diambil, pakai cabang bawaan"
              git -C "$path" fetch --quiet --depth 1 origin HEAD
              git -C "$path" checkout --quiet FETCH_HEAD
            fi
            git -C "$path" submodule update --init --recursive --depth 1 || true

            # Samakan penamaan dengan proyek ini (isi file dan nama file).
            rx='p{2}s{2}p{2}'
            grep -rIlEi "$rx" "$path" --exclude-dir=.git 2>/dev/null | while read -r f; do
              perl -pi -e 's/(p{2}s{2}p{2})/$1 eq lc($1) ? "suikaemulator" : "SuikaEmulator"/gie' "$f"
            done
            find "$path" -depth -not -path '*/.git/*' -regextype posix-extended -iregex '.*p{2}s{2}p{2}[^/]*' | while read -r f; do
              d=$(dirname "$f"); b=$(basename "$f")
              nb=$(echo "$b" | perl -pe 's/(p{2}s{2}p{2})/$1 eq lc($1) ? "suikaemulator" : "SuikaEmulator"/gie')
              mv "$f" "$d/$nb"
            done
          done

          for d in ffmpeg ext/glslang ext/freetype ext/armips ext/rcheevos ext/libchdr ext/aemu_postoffice; do
            echo "$d: $(ls -A "$d" | wc -l) item"
          done

      - name: Check Valid Version Tags
        id: valid-tags
        shell: bash
        run: |
          echo "count=$(git tag -l 'v[0-9]*' | wc -l | tr -d ' ')" >> $GITHUB_OUTPUT

      - name: Fetch upstream tags # dibutuhkan agar androidGitVersion tidak crash di fork baru
        if: steps.valid-tags.outputs.count == '0'
        run: |
          # No upstream tags on a fresh fork: create a local tag so git describe works.
          git tag v1.0.0 || true

      - name: Setup JDK
        uses: actions/setup-java@v6.0.1
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # Jika secret keystore diisi, APK ditandatangani dengan key sendiri.
      # Jika tidak, dipakai android/debug.keystore supaya APK tetap bisa diinstal.
      - name: Siapkan signing
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            {
              echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.keystore"
              echo "RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "RELEASE_KEY_ALIAS=$KEY_ALIAS"
              echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Memakai keystore rilis dari secrets."
          else
            {
              echo "RELEASE_STORE_FILE=$GITHUB_WORKSPACE/android/debug.keystore"
              echo "RELEASE_STORE_PASSWORD=android"
              echo "RELEASE_KEY_ALIAS=androiddebugkey"
              echo "RELEASE_KEY_PASSWORD=android"
            } >> "$GITHUB_ENV"
            echo "::warning::Secret KEYSTORE_BASE64 kosong, APK ditandatangani dengan debug.keystore."
          fi

      - name: Tentukan task Gradle
        id: tasks
        shell: bash
        run: |
          if [ "$VARIANT" = "AllRelease" ]; then
            echo "list=assembleNormalRelease assembleGoldRelease assembleLegacyRelease assembleVrRelease" >> $GITHUB_OUTPUT
          else
            echo "list=assemble$VARIANT" >> $GITHUB_OUTPUT
          fi

      - name: Beri izin eksekusi gradlew
        run: chmod +x ./gradlew

      - name: Assemble Release APK
        run: |
          ./gradlew ${{ steps.tasks.outputs.list }} \
            -PRELEASE_STORE_FILE="$RELEASE_STORE_FILE" \
            -PRELEASE_STORE_PASSWORD="$RELEASE_STORE_PASSWORD" \
            -PRELEASE_KEY_ALIAS="$RELEASE_KEY_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$RELEASE_KEY_PASSWORD" \
            --stacktrace

      - name: Kumpulkan APK
        run: |
          mkdir -p suikaemulator
          find android/build/outputs/apk -path "*release*" -name "*.apk" | while read -r f; do
            n=$(basename "$f")
            n="SuikaEmulator-${n#android-}"
            cp -v "$f" "suikaemulator/$n"
          done
          ls -lh suikaemulator/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: SuikaEmulator-${{ env.VARIANT }}
          path: suikaemulator/*.apk
          if-no-files-found: error

      - name: Upload ke GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: suikaemulator/*.apk
