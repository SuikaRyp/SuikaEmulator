name: Manual Generate iOS IPA/DEB
on:
  workflow_dispatch: {}

jobs:
  ios:
    name: Generate IPA & DEB
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
        
      - name: Check Valid Version Tags
        id: valid-tags
        shell: bash
        run: |
          echo "count=$(git tag -l 'v[0-9]*' | wc -l | tr -d ' ')" >> $GITHUB_OUTPUT

      - name: Fetch upstream tags # required for git describe to return a valid version on a new fork
        if: steps.valid-tags.outputs.count == '0'
        run: |
          # No upstream tags on a fresh fork: create a local tag so git describe works.
          git tag v1.0.0 || true

      - name: Set Env Var(s)
        run: |
          echo "GIT_VERSION=$(git describe --always)" >> $GITHUB_ENV

      - name: Install iOS dependencies
        run: |
          brew install ldid dpkg pillow
          # Check Xcode version
          xcodebuild -version
          # List available Xcode versions
          ls /Applications | grep Xcode
          # Select a specific Xcode version. The recommended Xcode version is 9.4.1 according to https://github.com/Halo-Michael/suikaemulator-builder
          #sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer

      - name: Create git-version.cpp & Version.txt
        run: |
          echo "const char *SuikaEmulator_GIT_VERSION = \"${GIT_VERSION}\";" > git-version.cpp
          echo "#define SuikaEmulator_GIT_VERSION_NO_UPDATE 1" >> git-version.cpp
          # Create Version.txt file (should probably do this during building process)
          mkdir -p build-ios/SuikaEmulator.app
          echo ${GIT_VERSION#v} > build-ios/SuikaEmulator.app/Version.txt

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ios
          create-symlink: true

      - name: Execute build
        env:
          CC: clang
          CXX: clang++
          USE_CCACHE: 1
        run: |
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          export CCACHE_SLOPPINESS=pch_defines,clang_index_store,ivfsoverlay,include_file_ctime,include_file_mtime,modules,system_headers,time_macros
          export CCACHE_FILECLONE=true
          export CCACHE_DEPEND=true
          export CCACHE_COMPILERCHECK=content
          ./b-ios.sh
      
      - name: Prepare artifacts
        run: |
          # Testing file location ...
          find . -name "*.app"
          mkdir suikaemulator
          if [ -e build-ios/SuikaEmulator.app ]; then
            # Get the final files generated by b-ios.h script
            find build -name 'SuikaEmulator*.ipa' -exec cp -a '{}' suikaemulator/ \;
            find build -name 'SuikaEmulator*.xcarchive' -exec cp -a '{}' suikaemulator/ \;
            find build -name 'SuikaEmulator*.deb' -exec cp -a '{}' suikaemulator/ \;
            find build -name 'org.suikaemulator*.deb' -exec cp -a '{}' suikaemulator/ \;
          fi

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: iOS-IPA build
          path: suikaemulator/*.ipa

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v7
        with:
          name: iOS-DEB build
          path: suikaemulator/*.deb
      
